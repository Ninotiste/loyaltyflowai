name: Signaler un bug
description: Décrire un comportement incorrect de LoyaltyFlowAI
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Merci de prendre le temps de signaler ce problème. N'incluez aucune donnée personnelle ni aucun secret."
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Que se passe-t-il ?
      placeholder: Décrivez le problème clairement.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: Navigateur, OS, version ou commit
  - type: textarea
    id: logs
    attributes:
      label: Logs (après suppression des données sensibles)
      render: text
    validations:
      required: false
